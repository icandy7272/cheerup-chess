server {
    listen 80;
    server_name chess.cheerup.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name chess.cheerup.tech;
    ssl_certificate /etc/letsencrypt/live/chess.cheerup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.cheerup.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/cheerup-chess/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
